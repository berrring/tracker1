name: safetrack_family
description: A local, Android-first family tracker UI prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  maplibre_gl: 0.27.0
  material_ui: ^1.1.0
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL-Inter.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
